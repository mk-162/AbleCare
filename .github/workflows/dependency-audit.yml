# Fails when a high or critical vulnerability is present in dependencies, so a
# new advisory shows up within a day instead of piling up in the Security tab.
name: dependency-audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Reads package-lock.json directly; no install needed. audit-ci instead
      # of plain `npm audit` so advisories that have NO patched release can be
      # allowlisted explicitly without muting the gate for new advisories.
      # Allowlisted (re-check for upstream fixes when touching dependencies):
      #   GHSA-vfj7-8cjw-p6xm  braces DoS — no patched release of braces
      #     exists; pulled in via @tinacms/cli > chokidar@3/micromatch.
      #   GHSA-7mx3-vvmw-hjmv  @graphql-tools/utils mergeDeep prototype
      #     pollution — every @graphql-tools/graphql-file-loader release
      #     depends on a vulnerable version; needs a TinaCMS upstream fix.
      #     (Overriding utils to >=12.1 breaks @tinacms/graphql, which imports
      #     the removed AggregateError export.)
      # Both are build-time-only code paths (Tina CLI), not shipped to visitors.
      - run: >-
          npx --yes audit-ci@^7 --high
          --allowlist GHSA-vfj7-8cjw-p6xm GHSA-7mx3-vvmw-hjmv
