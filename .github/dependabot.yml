version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      # Tina gets its own group, listed before minor-and-patch so it matches
      # first. A @tinacms/cli bump fails tina-lock-check until someone runs
      # `npm run tina:lock` and commits the result, which Dependabot cannot
      # do. Kept separate, that red PR doesn't hold every other update back.
      tina:
        patterns: ["tinacms", "@tinacms/*"]
        update-types: [minor, patch]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors are planned upgrades, not weekly PRs: they need migration work
      # and a visual check (e.g. markdown-it 15 changes how bare domains link,
      # @types/node must follow the Node runtime). Security is still covered:
      # Dependabot alerts are unaffected, and dependency-audit fails daily on
      # any high or critical advisory.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      # One monthly PR for workflow actions instead of one per action.
      actions:
        patterns: ["*"]
